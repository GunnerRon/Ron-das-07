<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{ csrf_token() }}">
  <title>{% block title %}Kudos{% endblock %} · Datacom Portal</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{{ url_for('views.dashboard') }}"><span aria-hidden="true">★</span> Kudos</a>
    {% if g.user %}
    <nav class="topnav" aria-label="Main">
      <span class="whoami">{{ g.user['display_name'] }}</span>
      {% if g.user['role'] == 'admin' %}<a href="{{ url_for('views.admin') }}">Moderation</a>{% endif %}
      <form method="post" action="{{ url_for('auth.logout') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <button type="submit" class="link-button">Sign out</button>
      </form>
    </nav>
    {% endif %}
  </header>
  <main class="container">
    {% for message in get_flashed_messages() %}
      <p class="notice" role="status">{{ message }}</p>
    {% endfor %}
    {% block content %}{% endblock %}
  </main>
  {% block scripts %}{% endblock %}
</body>
</html>
