{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>Sign in</h1>
  <p class="muted">Use your portal account to give and view kudos.</p>
  {% if error %}<p class="banner banner-error" role="alert">{{ error }}</p>{% endif %}
  <form method="post" novalidate>
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label for="email">Email</label>
    <input id="email" name="email" type="email" autocomplete="username" required value="{{ email }}">
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <button type="submit" class="primary">Sign in</button>
  </form>
</section>
{% endblock %}
